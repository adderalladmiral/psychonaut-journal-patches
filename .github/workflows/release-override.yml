name: Release

on:
  workflow_dispatch:
  push:

jobs:
  release:
    name: Release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6.0.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # Only build+release on dev and main branches, same scope as before.
      # Unlike semantic-release, this always publishes a release,
      # even if the change is too small to trigger a conventional-commit bump.
      - name: Set release tag
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
        id: tag
        run: echo "tag=build-$(date +%Y%m%d%H%M%S)-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build project
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid clean --no-daemon

      - name: Create release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Morphe Patches ${{ steps.tag.outputs.tag }}
          files: patches/build/libs/patches-*.mpp
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: 'Morphe Patches ${{ steps.tag.outputs.tag }}'
          subject-path: patches/build/libs/patches-*.mpp

      # Always verify compilation on branches other than main/dev.
      - name: Verify project compiles
        if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid clean --no-daemon      # Semantic release runs its own Gradle build command.
      # Only dev and main branch will generate a release as specified by .releaserc
      - name: Release
        uses: cycjimmy/semantic-release-action@v6
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: 'Morphe Patches ${{ steps.release.outputs.new_release_git_tag }}'
          subject-path: patches/build/libs/patches-*.mpp

      # Build and attest even when semantic-release found no relevant
      # commits to publish, so every push still produces an artifact.
      - name: Build project (no release published)
        if: steps.release.outputs.new_release_published != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid clean --no-daemon

      - name: Attest (no release published)
        if: steps.release.outputs.new_release_published != 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: 'Morphe Patches unreleased-${{ github.sha }}'
          subject-path: patches/build/libs/patches-*.mpp
